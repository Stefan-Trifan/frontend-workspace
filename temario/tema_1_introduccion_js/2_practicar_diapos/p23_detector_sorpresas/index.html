    <script>
        console.log("10" + 5);        // 105
        console.log("10" - 5);        // 5
        console.log(10 == "10");      // true
        console.log(10 === "10");     // false
        console.log(true + true);     // 
        console.log("" == false);     //   true
        console.log("" === false);    //   false
        console.log(null ?? "vacío"); //   "vacío"

        console.log(0 ?? "cero");     // 0
