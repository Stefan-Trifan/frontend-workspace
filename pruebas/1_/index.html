<body>
    <section>
        <h1 id="titulo">1</h1>
    </section>
    <script>
        // Métodos inmutables: el original NO cambia
        const original = [3, 1, 2];

        const ordenado = original.toSorted((a, b) => a - b); // [1, 2, 3]
        const invertido = original.toReversed();             // [2, 1, 3]
        const cambiado = original.with(0, 99);               // [99, 1, 2]

        console.log("ordenado:", ordenado);
        console.log("original:", original); // [3, 1, 2]  ← intacto

        // Ahora compáralo con la versión que muta:
        const otro = [3, 1, 2];
        otro.sort((a, b) => a - b);
        console.log("tras sort(), el original:", otro); // ← ya no es [3, 1, 2]
    </script>
</body>
